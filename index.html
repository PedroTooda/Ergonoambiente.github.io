<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>ERGOGAME</title>

  <!-- Layout desktop no mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://www.raylib.com/favicon.ico" rel="icon">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #081925;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Barra superior */
    #header {
      height: 60px;
      flex-shrink: 0;
      background: #081925;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 22px;
      box-sizing: border-box;
    }

    #logo-links {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #logo-links h2 {
      margin: 0;
      color: gold;
    }

    #logo-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    #logo-img {
      height: 32px;
    }

    #controls button {
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 5px;
      border: none;
      cursor: pointer;
    }

    /* Área do jogo */
    #game-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    /* Wrapper que força 16:9 */
    #canvas-wrapper {
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      image-rendering: pixelated;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div id="header">
    <div id="logo-links">
      <h2>ERGO NO AMBIENTE</h2>
      <a href="https://sites.google.com/ifsuldeminas.edu.br/programa-educativo-2/in%C3%ADcio">🌐 Site da Pesquisa</a>
      <a href="https://www.raylib.com" target="_blank">
        <img id="logo-img" src="https://www.raylib.com/favicon.ico"> Raylib
      </a>
    </div>

    <div id="controls">
      <button onclick="Module.requestFullscreen(false, false)">🖵 FULLSCREEN</button>
      <button onclick="toggleAudio()" id="btn-audio">🔇 MUTE</button>
    </div>
  </div>

  <!-- Jogo -->
  <div id="game-container">
    <div id="canvas-wrapper">
      <canvas id="canvas" class="emscripten"
        tabindex="-1"
        oncontextmenu="event.preventDefault()">
      </canvas>
    </div>
  </div>

  <!-- Áudio + Emscripten -->
  <script>
    var audioBtn = null;
    const audioContexList = [];

    function toggleAudio() {
      if (!audioBtn) audioBtn = document.querySelector("#btn-audio");
      let toggled = false;

      audioContexList.forEach(ctx => {
        if (ctx.state === "suspended") {
          ctx.resume();
          toggled = true;
        } else {
          ctx.suspend();
        }
      });

      audioBtn.textContent = toggled ? "🔇 MUTE" : "🔈 RESUME";
    }

    self.AudioContext = new Proxy(self.AudioContext, {
      construct(target, args) {
        const ctx = new target(...args);
        audioContexList.push(ctx);
        return ctx;
      }
    });

    var Module = {
      preRun: [],
      postRun: [],
      canvas: document.getElementById("canvas"),
      setStatus: function (text) { console.log(text); },
      monitorRunDependencies: function () { }
    };
  </script>

  <script src="main.js"></script>

</body>
</html>
